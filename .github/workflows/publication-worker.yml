name: Process publication queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process due publications
        env:
          WORKER_SECRET: ${{ secrets.PUBLICATION_WORKER_SECRET }}
        run: |
          test -n "$WORKER_SECRET"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "x-worker-secret: $WORKER_SECRET" \
            --header 'Content-Type: application/json' \
            'https://kqumdrlrkrsgztfwavdr.supabase.co/functions/v1/publish-queue')"
          cat "$response_file"
          test "$status" -ge 200 -a "$status" -lt 300
